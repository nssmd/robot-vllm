name: Runtime contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deployment/Dockerfile -t robot-runtime:ci .
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]' ruff
      - run: ruff check robot_vllm tests scripts examples
      - run: python -m pytest -q
      - run: python -m robot_vllm.control_cli demo --arms 4
      - run: python scripts/http_smoke.py
      - run: python -m robot_vllm.control_cli validate-config --config configs/system.ros2.example.json
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-${{ matrix.python }}-evidence
          path: runs/
          retention-days: 14
  ros2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ros-jazzy-control-msgs ros-jazzy-sensor-msgs python3-venv
          python3 -m venv --system-site-packages /opt/test-env
          /opt/test-env/bin/pip install -e '.[simulation]'
      - shell: bash
        env:
          ROS_DOMAIN_ID: '173'
          ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
        run: |
          source /opt/ros/jazzy/setup.bash
          /opt/test-env/bin/python -m robot_vllm.system_validation --arms 2
          /opt/test-env/bin/python scripts/ros_restart_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ros2-runtime-evidence
          path: |
            runs/system-validation
            runs/ros-restart
          retention-days: 14
