[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-vllm"
version = "0.4.0"
description = "GP6 task DAGs, VLA policies and multi-robot execution through ROS 2"
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux", "Topic :: Scientific/Engineering :: Artificial Intelligence"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "numpy", "pillow", "httpx", "fastapi", "uvicorn"]
libero = ["numpy", "pillow"]
serve = ["fastapi", "uvicorn"]
simulation = ["mujoco>=3.3,<4", "numpy", "pillow"]

[project.urls]
Repository = "https://github.com/nssmd/robot-vllm"
Issues = "https://github.com/nssmd/robot-vllm/issues"

[project.scripts]
robot-vllm = "robot_vllm.cli:main"
robot-runtime = "robot_vllm.control_cli:main"

[tool.setuptools.packages.find]
include = ["robot_vllm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
