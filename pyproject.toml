[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-vllm"
version = "0.5.0"
description = "GP6 task DAGs, VLA policies and multi-robot execution through ROS 2"
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux", "Topic :: Scientific/Engineering :: Artificial Intelligence"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "numpy", "pillow", "httpx", "fastapi", "uvicorn"]
libero = ["numpy", "pillow"]
serve = ["fastapi", "uvicorn"]
simulation = ["mujoco>=3.3,<4", "numpy", "pillow"]
pi05 = ["openpi-client @ git+https://github.com/Physical-Intelligence/openpi.git@215abfb217dbac7d5f1273282331b9b1866c0479#subdirectory=packages/openpi-client", "websockets>=14,<16", "fastapi", "uvicorn"]

[project.urls]
Repository = "https://github.com/nssmd/robot-vllm"
Issues = "https://github.com/nssmd/robot-vllm/issues"

[project.scripts]
robot-vllm = "robot_vllm.cli:main"
robot-runtime = "robot_vllm.control_cli:main"
robot-runtime-pi05 = "robot_vllm.pi05:main"

[tool.setuptools.packages.find]
include = ["robot_vllm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
